import groovy.xml.XmlUtil

plugins {
    id 'java'
    id 'war'
}

group = 'core'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

configurations {
    jdbc {
        transitive = false
    }
}

dependencies {
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:10.0.0'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.2'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testImplementation 'jakarta.platform:jakarta.jakartaee-api:10.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.jboss.resteasy:resteasy-core:6.2.11.Final'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.4'

    implementation('org.eclipse.persistence:org.eclipse.persistence.jpa:4.0.4') {
        exclude group: 'org.eclipse.persistence', module: 'org.eclipse.persistence.moxy'
        exclude group: 'org.eclipse.persistence', module: 'org.eclipse.persistence.json'
        exclude group: 'jakarta.persistence'
        exclude group: 'jakarta.json'
        exclude group: 'jakarta.enterprise'
        exclude group: 'jakarta.transaction'
        exclude group: 'jakarta.validation'
        exclude group: 'org.apache.ant'
    }
    jdbc 'org.postgresql:postgresql:42.7.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def profile = findProperty('profile') ?: 'local'
def profileConfig = file("config/${profile}.properties")
def wildflyHome = file(findProperty('wildflyHome'))
def windows = System.getProperty('os.name').startsWith('Windows')

def wildflyScript = { String name ->
    def script = "${wildflyHome}/bin/${name}"
    return windows ? ["${script}.bat"] : ['sh', "${script}.sh"]
}

def loadDbConfig = {
    def db = new Properties()
    if (profileConfig.exists()) {
        profileConfig.withInputStream { db.load(it) }
    }
    return db
}

war {
    archiveFileName = 'lab1.war'
    def db = loadDbConfig()
    inputs.properties(db)
    from('config/lab1-ds.xml') {
        into 'WEB-INF'
        expand(
                url: XmlUtil.escapeXml(db.getProperty('db.url', '')),
                user: XmlUtil.escapeXml(db.getProperty('db.user', '')),
                password: XmlUtil.escapeXml(db.getProperty('db.password', ''))
        )
    }
    doFirst {
        if (!profileConfig.exists()) {
            throw new GradleException("${profileConfig} not found, copy config/example.properties")
        }
    }
}

def runSql = { FileCollection classpath, List<File> scripts ->
    def db = loadDbConfig()
    def props = new Properties()
    props.setProperty('user', db.getProperty('db.user'))
    props.setProperty('password', db.getProperty('db.password'))

    def loader = new URLClassLoader(classpath.files.collect { it.toURI().toURL() } as URL[])
    def driver = loader.loadClass('org.postgresql.Driver').getDeclaredConstructor().newInstance()
    def conn = driver.connect(db.getProperty('db.url'), props)
    try {
        scripts.each {
            conn.createStatement().execute(it.getText('UTF-8'))
            println "applied ${it.name}"
        }
    } finally {
        conn.close()
    }
}

tasks.register('setupDb') {
    group = 'lab1'
    def classpath = configurations.jdbc
    def scripts = [file('sql/schema.sql'), file('sql/functions.sql')]
    doLast {
        runSql(classpath, scripts)
    }
}

tasks.register('seedDb') {
    group = 'lab1'
    dependsOn 'setupDb'
    def classpath = configurations.jdbc
    def scripts = [file('sql/seed.sql')]
    doLast {
        runSql(classpath, scripts)
    }
}

tasks.register('jdbcDriver', Copy) {
    group = 'lab1'
    from configurations.jdbc
    into layout.buildDirectory.dir('libs')
    rename { 'postgresql.jar' }
}

tasks.register('deploy', Copy) {
    group = 'lab1'
    from tasks.named('war')
    from(configurations.jdbc) {
        rename { 'postgresql.jar' }
    }
    into "${wildflyHome}/standalone/deployments"
    doFirst {
        if (!wildflyHome.exists()) {
            throw new GradleException("WildFly not found in ${wildflyHome}, set wildflyHome in gradle.properties")
        }
    }
}

tasks.register('up', Exec) {
    group = 'lab1'
    dependsOn 'setupDb', 'deploy'
    commandLine wildflyScript('standalone')
    environment 'NOPAUSE', 'true'
    doFirst {
        println 'Application: http://localhost:8080/lab1/'
    }
}

tasks.register('stopServer', Exec) {
    group = 'lab1'
    commandLine wildflyScript('jboss-cli') + ['--connect', '--command=shutdown']
    environment 'NOPAUSE', 'true'
    ignoreExitValue = true
}

test {
    useJUnitPlatform()
    systemProperty 'postgresTests', project.hasProperty('postgresTests')
}
